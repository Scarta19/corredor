[project]
name = "corredor-ml"
version = "0.1.0"
description = "Modelling library for the Corredor platform: lead scoring, renewal risk, cross-sell and message understanding."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
  "pydantic>=2.10",
  "numpy>=2.2",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "anthropic>=0.42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corredor_ml"]
