name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  backend:
    name: API · lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: corredor
          POSTGRES_PASSWORD: corredor
          POSTGRES_DB: corredor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corredor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: clave-solo-para-ci-de-al-menos-32-bytes
      DATABASE_URL: postgresql+asyncpg://corredor:corredor@localhost:5432/corredor

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy apps/api/src packages/ml/src

      - name: Migrations apply cleanly, and match the models
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          # A non-empty autogenerate diff means someone changed a model and
          # forgot the migration. Catch it here, not in a deploy.
          uv run alembic check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  web:
    name: Web · lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
