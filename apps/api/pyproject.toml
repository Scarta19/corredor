[project]
name = "corredor-api"
version = "0.1.0"
description = "Corredor platform API: CRM, quoting, renewals and the intelligence layer for insurance brokers."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.28",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "corredor-ml",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.14",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corredor"]
